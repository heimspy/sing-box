name: Heimspy inspector
on:
  push:
    branches: [heimspy]
  pull_request:
    branches: [heimspy]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - name: Race tests, vet and reachable-vulnerability scan
        shell: bash
        run: bash scripts/test-heimspy.sh
